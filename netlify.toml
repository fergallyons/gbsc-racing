[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  command = "printf '{\"commit\":\"%s\",\"built\":\"%s\"}' \"$(echo $COMMIT_REF | cut -c1-7)\" \"$(TZ='Europe/Dublin' date '+%d %b %H:%M %Z')\" > version.json"

# Automatic finish-time detection for races.automated — runs every minute.
# The first scheduled function this app has needed (see detect-finishes.js).
[functions."detect-finishes"]
  schedule = "* * * * *"

# "Results are up" push notifications for Sail Scoring clubs (results-watch.js)
[functions."results-watch"]
  schedule = "*/10 * * * *"

# Keeps each club's Sail Scoring connection alive over quiet spells: a grant
# ends after 180 days without a token renewal (ss-keepalive.js) — Mondays 04:00 UTC
[functions."ss-keepalive"]
  schedule = "0 4 * * 1"

# The app's race list follows Sail Scoring for Sail Scoring clubs (ss-sync.js).
# Every 4 hours, not every 15 minutes — Sail Scoring reported 2026-11-08 that
# this sweep (the signed-in half of the integration; the public results-watch
# calls are served from published files and don't hit their database) was
# running ~96 times/day, every day including the off-season, and each run
# wakes their scale-to-zero database for a 5-minute minimum before it can
# sleep again: ~8 hours/day of forced-awake time, ~$75-80/year, for a sync
# whose entire point is "without anyone pressing anything" — not instant.
# An RO who wants it right now already has that: the Results tile's manual
# "sync" (ss-ro.js) and every RO change made there run syncClub() directly,
# unaffected by this schedule. 6 sweeps/day keeps that same guarantee at a
# few hours' lag instead of 15 minutes, for a ~94% cut in wake-ups.
# And each run only calls Sail Scoring when racing needs it (_sssync.js
# syncDue, migration 080): every run with a race yesterday/today/tomorrow,
# daily with racing in the next fortnight, weekly otherwise — about one
# wake-up a week in the off-season. An RO opening the app also syncs if the
# last one is a few hours old.
[functions."ss-sync"]
  schedule = "0 */4 * * *"

[[edge_functions]]
  path = "/club-config.js"
  function = "club-config"

[[edge_functions]]
  path = "/manifest.json"
  function = "manifest"

[[edge_functions]]
  path = "/"
  function = "rewrite-club-links"

# Stripe Payment Link success redirect — Stripe sends crew back here after card payment
[[redirects]]
  from = "/stripe-success"
  to = "/?stripe_success=1"
  status = 302

# Catch-all for any unknown path — serves the app so JS handles routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML and JS/CSS — never cache at CDN; always serve fresh
# (no content-hash in filenames, so CDN must revalidate on every deploy)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets that never change — cache for a year
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
